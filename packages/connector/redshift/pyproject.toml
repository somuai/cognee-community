[project]
name = "cognee-community-connector-redshift"
version = "0.1.0"
description = "Amazon Redshift data-source connector for cognee -- sync SVV_TABLE_INFO layouts, schemas, PK/FK constraints, and operational query lineage into memory (full snapshot + forget-on-delete)"
readme = "README.md"
requires-python = ">=3.11,<=3.13"
dependencies = [
    "cognee==1.4.0",
    "dlt[sqlalchemy]>=1.9.0,<2",
    "pydantic>=2.0.0,<3",
]

[project.optional-dependencies]
data-api = [
    "boto3>=1.34.0,<2",
]
db-api = [
    "redshift-connector>=2.1.0,<3",
]

[project.urls]
Homepage = "https://github.com/topoteretes/cognee"
Repository = "https://github.com/topoteretes/cognee-community"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_redshift"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "C4", "PGH", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
